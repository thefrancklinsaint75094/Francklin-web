<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Dispatch</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
  --card: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #111111);
  --muted: var(--tg-theme-hint-color, #8a8a8e);
  --accent: var(--tg-theme-button-color, #2f7cf6);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --line: rgba(127, 127, 127, .16);
  --soft: rgba(127, 127, 127, .10);
  --green: #22a35a; --orange: #e8890c; --red: #e0453a; --blue: #2f7cf6; --violet: #8a5cf6;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--tg-theme-secondary-bg-color, #000000);
    --card: var(--tg-theme-bg-color, #1c1c1e);
    --text: var(--tg-theme-text-color, #f2f2f2);
    --muted: var(--tg-theme-hint-color, #8d8d93);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

/* ---------- barre du haut */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 12px 8px;
  display: flex; align-items: center; gap: 10px; }
.burger { width: 40px; height: 40px; border-radius: 12px; background: var(--card); font-size: 20px; flex: none; }
.top .t { flex: 1; min-width: 0; }
.top h1 { margin: 0; font-size: 20px; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .sub { color: var(--muted); font-size: 12px; }
.live { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }
.dot.off { background: var(--red); }

/* ---------- menu de gauche */
.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.drawer-bg.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(82vw, 320px); z-index: 41; background: var(--card);
  transform: translateX(-102%); transition: transform .22s ease, visibility .22s; overflow-y: auto; visibility: hidden;
  padding: calc(14px + env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom)); box-shadow: 4px 0 24px rgba(0,0,0,.18); }
.drawer.open { transform: none; visibility: visible; }
.drawer .me { padding: 6px 10px 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.drawer .me b { display: block; font-size: 18px; }
.drawer .me span { color: var(--muted); font-size: 13px; }
.nav { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 10px; border-radius: 12px; text-align: left; font-weight: 500; }
.nav .i { width: 26px; text-align: center; font-size: 19px; }
.nav .n { margin-left: auto; font-size: 12px; font-weight: 700; background: var(--soft); border-radius: 99px; padding: 2px 8px; }
.nav .n.red { background: var(--red); color: #fff; }
.nav.on { background: var(--accent); color: var(--accent-text); }
.nav.on .n { background: rgba(255,255,255,.25); color: inherit; }
.drawer .sep { height: 1px; background: var(--line); margin: 8px 6px; }

/* ---------- contenu */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 12px; }
.stat { background: var(--card); border-radius: 12px; padding: 9px 4px; text-align: center; }
.stat b { display: block; font-size: 18px; }
.stat span { color: var(--muted); font-size: 11px; }
.h2 { display: flex; align-items: baseline; gap: 8px; font-size: 13px; text-transform: uppercase; color: var(--muted);
  margin: 18px 16px 8px; letter-spacing: .3px; font-weight: 600; }
.h2 .more { margin-left: auto; text-transform: none; color: var(--accent); font-weight: 600; }
.list { padding: 0 12px; display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--card); border-radius: var(--radius); padding: 12px 14px; }
.tap { cursor: pointer; }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.num { font-weight: 700; font-size: 16px; }
.pill { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; color: #fff; white-space: nowrap; }
.p-pending { background: var(--orange); } .p-assigned { background: var(--blue); }
.p-delivered { background: var(--green); } .p-alert { background: var(--red); } .p-pick { background: var(--violet); }
.right { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.place { font-weight: 600; margin-top: 6px; }
.addr { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who { margin-top: 6px; font-size: 14px; }
.prod { color: var(--muted); font-size: 13px; margin-top: 4px; }
.price { font-weight: 700; color: var(--text); }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.badge { font-size: 12px; background: var(--soft); border-radius: 8px; padding: 3px 8px; }
.badge.warn { color: var(--red); font-weight: 600; }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.btn { background: var(--soft); border-radius: 10px; padding: 10px 6px; font-size: 13px; font-weight: 600; text-align: center; }
.btn.main { background: var(--accent); color: var(--accent-text); }
.btn.danger { color: var(--red); }
.full { width: 100%; margin-top: 10px; padding: 13px; }
.empty { text-align: center; color: var(--muted); padding: 30px 20px; }
.empty b { display: block; font-size: 30px; margin-bottom: 6px; }

/* livreur sur la route : une seule adresse à la fois */
.route .lv { font-weight: 700; font-size: 16px; }
.route .now { display: flex; gap: 12px; margin-top: 8px; align-items: center; }
.route .where { flex: 1; min-width: 0; }
.route .eta { text-align: right; flex: none; }
.route .eta b { display: block; font-size: 22px; letter-spacing: -.5px; }
.route .eta span { font-size: 11px; color: var(--muted); }
.route .eta.late b { color: var(--red); }
.route .next { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
.route .next div { padding: 2px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border-radius: 99px; padding: 7px 12px; font-size: 13px; margin: 0 6px 6px 0; }
.chips { padding: 0 12px; }
.mini { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mini:last-child { border-bottom: 0; }
.mini .k { font-weight: 700; width: 44px; flex: none; }

.switch { width: 50px; height: 30px; border-radius: 99px; background: var(--line); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .15s; }
.switch.on { background: var(--green); } .switch.on::after { left: 23px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; background: var(--soft); font-size: 17px; flex: none; }
.seg { display: flex; background: var(--card); border-radius: 10px; padding: 3px; margin: 4px 12px 10px; }
.seg button { flex: 1; padding: 7px 4px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--accent-text); }
.feed .item { display: flex; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.feed .item:last-child { border-bottom: 0; }
.feed .at { color: var(--muted); font-size: 12px; width: 38px; flex: none; padding-top: 2px; }
.feed .txt { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.feed .item.imp .txt { font-weight: 600; }
.feed .item.imp .at { color: var(--red); }
.big { font-size: 34px; font-weight: 800; letter-spacing: -.5px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.grid { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
.grid span:nth-child(even) { text-align: right; font-weight: 600; }
.cmd { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.cmd:last-child { border-bottom: 0; }
.cmd small { display: block; color: var(--muted); font-size: 12px; }
input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--soft); border: 1px solid var(--line);
  border-radius: 10px; padding: 11px 12px; outline: none; }
textarea { min-height: 76px; resize: vertical; }
.search { margin: 4px 12px 10px; width: calc(100% - 24px); }

/* fenêtre du bas */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: none; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--card); border-radius: 18px 18px 0 0;
  max-height: 86vh; overflow: auto; padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); transform: translateY(105%);
  transition: transform .2s, visibility .2s; visibility: hidden; }
.sheet.open { transform: none; visibility: visible; }
.sheet .grab { width: 38px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 10px; }
.sheet h3 { margin: 0 0 4px; font-size: 18px; }
.sheet p { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
.choice { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.choice:last-child { border-bottom: 0; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 60;
  background: #222; color: #fff; padding: 12px 14px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: .95; }
.hidden { display: none !important; }
.fab { position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 30; height: 54px; padding: 0 20px;
  border-radius: 99px; background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 15px;
  box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.field { margin-top: 10px; }
.field > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
select { width: 100%; font: inherit; color: var(--text); background: var(--soft); border: 1px solid var(--line);
  border-radius: 10px; padding: 11px 12px; outline: none; -webkit-appearance: none; appearance: none; }
.line { display: grid; grid-template-columns: 1fr 74px 84px 34px; gap: 6px; margin-top: 8px; align-items: center; }
.line.two { grid-template-columns: 80px 1fr 34px; }
.line input { padding: 9px 8px; }
.x { width: 34px; height: 38px; border-radius: 10px; background: var(--soft); color: var(--red); font-size: 16px; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px; }
.tools .btn { padding: 14px 6px; }
.result { font-size: 14px; white-space: pre-wrap; word-break: break-word; background: var(--soft); border-radius: 12px; padding: 12px; margin-top: 10px; }
.toggle { display: flex; background: var(--soft); border-radius: 10px; padding: 3px; }
.toggle button { flex: 1; padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.toggle button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.row-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.row-actions .btn { flex: 1; min-width: 30%; }
.loading { text-align: center; color: var(--muted); padding: 40px; }
</style>
</head>
<body>
<header class="top">
  <button class="burger" id="burger" aria-label="Menu">☰</button>
  <div class="t"><h1 id="title">En direct</h1><div class="sub" id="night">Chargement…</div></div>
  <div class="live"><span class="dot" id="live"></span><span id="updated">—</span></div>
</header>

<main id="view"><div class="loading">Chargement…</div></main>

<div class="drawer-bg" id="drawer-bg"></div>
<aside class="drawer" id="drawer"></aside>
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheet-body"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch (e) {} }
const INIT = tg ? tg.initData : "";
const SCREENS = [
  { key: "home", icon: "🏠", label: "En direct" },
  { key: "courses", icon: "🚚", label: "Courses" },
  { key: "livreurs", icon: "🛵", label: "Livreurs" },
  { key: "stock", icon: "📦", label: "Stock" },
  { key: "products", icon: "🍾", label: "Produits" },
  { key: "cash", icon: "💶", label: "Caisse" },
  { key: "bilan", icon: "📊", label: "Bilan de la nuit" },
  { key: "feed", icon: "🔔", label: "Activité" },
  { key: "team", icon: "👥", label: "Équipe" },
  { key: "plus", icon: "⚙️", label: "Commandes et réglages" },
];
const S = { screen: "home", seg: null, open: null, data: null, feed: [], feedImportant: false, busy: false, cache: {}, q: "" };
const $ = (id) => document.getElementById(id);

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k !== null && k !== undefined && k !== false) n.append(k.nodeType ? k : String(k));
  return n;
}
const nodes = (...kids) => kids.flat(Infinity).filter((k) => k !== null && k !== undefined && k !== false);
const eur = (v) => (Math.round((v || 0) * 100) / 100).toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " €";
const haptic = (t) => { try { tg && tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const tap = () => { try { tg && tg.HapticFeedback.impactOccurred("light"); } catch (e) {} };
const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;
const who = (p) => p ? (p.prenom ? `${p.name} (${p.prenom})` : p.name) : "—";
const plain = (s) => String(s || "").replace(/<[^>]+>/g, "").replace(/&gt;/g, ">").replace(/&lt;/g, "<").replace(/&amp;/g, "&");

async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Init-Data": INIT },
                                body: JSON.stringify(body || {}) });
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  return r.json();
}
function toast(msg) {
  const t = $("toast"); t.textContent = plain(msg); t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2800);
}
function confirmBox(text) {
  return new Promise((ok) => tg && tg.showConfirm ? tg.showConfirm(text, ok) : ok(window.confirm(text)));
}

// ------------------------------------------------------------------ chargement
async function load(quiet) {
  try {
    S.data = await api("/api/board");
    $("live").className = "dot"; $("updated").textContent = S.data.now;
    if (!S.seg) S.seg = S.data.pending.length ? "pending" : "assigned";
    $("night").textContent = `Nuit du ${S.data.night}`;
    drawer();
    if (!$("sheet").classList.contains("open") && ["home", "courses", "livreurs", "bilan", "plus"].includes(S.screen)) render();
  } catch (e) {
    $("live").className = "dot off";
    if (!quiet) $("view").replaceChildren(el("div", { class: "empty" }, el("b", {}, "⚠️"), "Impossible de charger : " + e.message));
  }
}
async function loadFeed(more) {
  const before = more && S.feed.length ? S.feed[S.feed.length - 1].id : null;
  const r = await api("/api/feed", { before });
  S.feed = more ? S.feed.concat(r.items) : r.items;
  S.feedEnd = r.items.length < 80;
  if (S.screen === "feed") render();
}
async function loadSection(name) {
  S.cache[name] = { loading: true };
  if (S.screen === name) render();
  try { S.cache[name] = await api("/api/section", { name }); }
  catch (e) { S.cache[name] = { ok: false, error: e.message }; }
  if (S.screen === name) render();
}

async function forms() {
  if (!S.forms) S.forms = await api("/api/section", { name: "forms" });
  return S.forms;
}
function select(options, value, placeholder) {
  const s = el("select", {}, placeholder ? el("option", { value: "" }, placeholder) : null,
    options.map((o) => { const v = typeof o === "string" ? o : o.value; const l = typeof o === "string" ? o : o.label;
      const opt = el("option", { value: v }, l); if (v === value) opt.selected = true; return opt; }));
  return s;
}
const field = (label, input) => el("label", { class: "field" }, el("span", {}, label), input);
function productList() {
  const id = "products-list";
  if (!document.getElementById(id) && S.forms) document.body.append(el("datalist", { id }, S.forms.products.map((p) => el("option", { value: p }))));
  return id;
}
function showResult(title, html, ok, after) {
  openSheet(el("h3", {}, (ok === false ? "⚠️ " : "") + title), el("div", { class: "result" }, safeHtml(html || "")),
    el("button", { class: "btn main full", onclick: () => { closeSheet(); if (after) after(); } }, "OK"));
}
async function call(body) {
  tap();
  try { const r = await api("/api/action", body); haptic(r.ok ? "success" : "error"); return r; }
  catch (e) { haptic("error"); toast("Erreur : " + e.message); return { ok: false }; }
}

// ------------------------------------------------------------------ menu de gauche
function drawer() {
  const d = S.data;
  const counts = d ? { home: d.routes.length || "", courses: d.pending.length || "", livreurs: d.livreurs.filter((l) => l.on_duty).length || "" } : {};
  $("drawer").replaceChildren(...nodes(
    el("div", { class: "me" }, el("b", {}, "Dispatch"), el("span", {}, d ? `${d.me.name} · ${d.me.dispatch ? "dispatch" : "franchisé"}` : "")),
    SCREENS.map((s, i) => [
      i === 3 || i === 7 ? el("div", { class: "sep" }) : null,
      el("button", { class: "nav" + (S.screen === s.key ? " on" : ""), onclick: () => go(s.key) },
        el("span", { class: "i" }, s.icon), s.label,
        counts[s.key] ? el("span", { class: "n" + (s.key === "courses" ? " red" : "") }, counts[s.key]) : null)])));
}
function openDrawer() { tap(); $("drawer").classList.add("open"); $("drawer-bg").classList.add("open"); }
function closeDrawer() { $("drawer").classList.remove("open"); $("drawer-bg").classList.remove("open"); }
$("burger").addEventListener("click", openDrawer);
$("drawer-bg").addEventListener("click", closeDrawer);
let touchX = null;
document.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (touchX < 30 && dx > 60) openDrawer();
  if ($("drawer").classList.contains("open") && dx < -60) closeDrawer();
  touchX = null;
}, { passive: true });

function go(key) {
  S.screen = key; S.open = null; S.q = ""; closeDrawer(); window.scrollTo(0, 0);
  $("title").textContent = SCREENS.find((s) => s.key === key).label;
  if (key === "feed") loadFeed(false);
  if (["stock", "cash", "products", "team"].includes(key)) loadSection(key);
  drawer(); render();
}

// ------------------------------------------------------------------ écrans
function render() {
  if (!S.data) return;
  const views = { home: viewHome, courses: viewCourses, livreurs: viewLivreurs, stock: viewStock, products: viewProducts,
                  cash: viewCash, bilan: viewBilan, feed: viewFeed, team: viewTeam, plus: viewPlus };
  const v = views[S.screen]();
  const fab = ["home", "courses"].includes(S.screen) ? el("button", { class: "fab", onclick: newOrder }, "➕ Commande") : null;
  $("view").replaceChildren(...nodes(v, fab, el("div", { style: "height:70px" })));
}

function stats() {
  const d = S.data;
  return el("div", { class: "stats" },
    el("div", { class: "stat" }, el("b", {}, d.pending.length), el("span", {}, "à attribuer")),
    el("div", { class: "stat" }, el("b", {}, d.assigned.length), el("span", {}, "en livraison")),
    el("div", { class: "stat" }, el("b", {}, d.totals.n), el("span", {}, "livrées")),
    el("div", { class: "stat" }, el("b", {}, eur(d.totals.total)), el("span", {}, "encaissé")));
}

function viewHome() {
  const d = S.data;
  const wrap = el("div", {}, stats());
  if (d.pending.length) {
    wrap.append(el("div", { class: "h2" }, "⚠️ À attribuer", el("button", { class: "more", onclick: () => { S.seg = "pending"; go("courses"); } }, "Tout voir")));
    wrap.append(el("div", { class: "list" }, d.pending.map(courseCard)));
  }
  wrap.append(el("div", { class: "h2" }, "🛵 Sur la route", el("span", { class: "more muted" }, d.routes.length ? plural(d.routes.length, "livreur") : "")));

const ALLOWED = new Set(["B", "STRONG", "I", "EM", "U", "S", "CODE", "PRE", "BR"]);
function safeHtml(html) {
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html");
  const clean = (node) => {
    const out = document.createDocumentFragment();
    node.childNodes.forEach((ch) => {
      if (ch.nodeType === 3) out.append(ch.textContent);
      else if (ch.nodeType === 1) {
        if (!ALLOWED.has(ch.tagName)) { out.append(clean(ch)); return; }
        const n = document.createElement(ch.tagName); n.append(clean(ch)); out.append(n);
      }
    });
    return out;
  };
  return clean(doc.body.firstChild);
}

async function doAction(body, question) {
  if (S.busy) return;
  if (question && !(await confirmBox(question))) return;
  S.busy = true; tap();
  try {
    const r = await api("/api/action", body);
    haptic(r.ok ? "success" : "error");
    if (r.message) toast(r.message);
    if (r.close && r.ok && tg) setTimeout(() => tg.close(), 800);
    await load(true);
    render();
  } catch (e) {
    haptic("error"); toast("Erreur : " + e.message);
  } finally { S.busy = false; }
}

async function twoStep(kind, title, build) {
  const text = build(); if (text === null) return;
  const extra = typeof text === "object" ? text : { text };
  const r = await call(Object.assign({ type: kind + "_prepare" }, extra));
  if (!r.ok) { if (r.html) showResult(title, r.html, false); else toast(r.message || "Erreur"); return; }
  openSheet(el("h3", {}, title), el("div", { class: "result" }, safeHtml(r.html)),
    el("button", { class: "btn main full", onclick: async () => {
      const done = await call(Object.assign({ type: kind + "_commit" }, extra));
      showResult(title, done.html || done.message, done.ok, () => { load(true); S.cache = {}; });
    } }, "✅ Enregistrer"),
    el("button", { class: "btn full", onclick: closeSheet }, "Annuler"));
}

async function restockForm(cashOnly) {
  const f = await forms();
  const ravi = select(f.ravitailleurs, f.ravitailleurs[0]);
  const lv = select(f.livreurs, "", "Choisis le livreur");
  const box = select(f.boxes, f.boxes[0]);
  let mode = "+";
  const toggle = el("div", { class: "toggle" });
  const drawToggle = () => toggle.replaceChildren(
    el("button", { class: mode === "+" ? "on" : "", onclick: () => { mode = "+"; drawToggle(); } }, "📦 Charger"),
    el("button", { class: mode === "-" ? "on" : "", onclick: () => { mode = "-"; drawToggle(); } }, "↩️ Reprendre"));
  drawToggle();
  const items = itemLines();
  const cash = textInput({ type: "number", min: "0", placeholder: "0", inputmode: "decimal" });
  const title = cashOnly ? "💶 Cash récupéré" : "🔄 Rechargement";
  openSheet(el("h3", {}, title), el("p", {}, cashOnly ? "Le cash que le ravitailleur récupère chez le livreur." : "Ce que le ravitailleur charge au livreur (ou lui reprend), et le cash récupéré."),
    field("Ravitailleur", ravi), field("Livreur", lv),
    cashOnly ? null : field("Box", box), cashOnly ? null : el("div", { class: "field" }, toggle),
    cashOnly ? null : items.node, field("Cash récupéré (€)", cash),
    el("button", { class: "btn main full", onclick: () => twoStep("ravi", title, () => {
      if (!lv.value) { toast("Choisis le livreur."); return null; }
      const lines = [lv.value];
      const its = cashOnly ? [] : items.lines();
      if (its.length) { lines.push(/^box/i.test(box.value) ? box.value : "Box " + box.value); its.forEach((i) => lines.push(`${mode === "-" ? "-" : ""}${i.q} ${i.p}`)); }
      if (parseFloat(cash.value) > 0) lines.push("cash " + cash.value);
      if (lines.length === 1) { toast(cashOnly ? "Indique le montant." : "Ajoute un produit ou du cash."); return null; }
      return { ravi: ravi.value, text: lines.join("\n") };
    }) }, "Voir le récap"));
}

      item("🔄", "Changer de rôle", () => openSheet(el("h3", {}, "🔄 Nouveau rôle"), el("p", {}, "Un livreur qui change de rôle quitte le service ; ses courses repartent aux autres."),
        roles.map(([r, l]) => el("button", { class: "choice", onclick: () => act("user_role", { value: r }, `${u.name} devient ${l} ?`) }, el("span", { class: "grow" }, l), el("span", { class: "muted" }, "›")))));
      if (u.status === "active") item("⛔", "Bannir", () => act("user_ban", {}, `Bannir ${u.name} ? Il n'a plus aucun accès.`));
      if (u.status === "banned") item("✅", "Réactiver", () => act("user_unban"));
      item("🗑", "Supprimer le compte", () => act("user_delete", {}, `Supprimer le compte de ${u.name} ? Définitif (il pourra se réinscrire).`));
    }
  }
  openSheet(el("h3", {}, who(u)), el("p", {}, [u.role_label, u.real_name, u.username ? "@" + u.username : null].filter(Boolean).join(" · ")),
    items.length ? items : el("div", { class: "muted" }, "Rien à modifier ici."));
}

drawer();
load(false);
setInterval(() => { if (!document.hidden) { load(true); if (S.screen === "feed") loadFeed(false); } }, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(true); });
</script>
</body>
